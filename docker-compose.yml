services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ledgerguard
      POSTGRES_PASSWORD: ledgerguard
      POSTGRES_DB: ledgerguard
    ports: ["5432:5432"]
    volumes: ["ledgerguard_pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledgerguard -d ledgerguard"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  ledgerguard_pgdata:

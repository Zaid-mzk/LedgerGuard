name: CI
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: ledgerguard, POSTGRES_PASSWORD: ledgerguard, POSTGRES_DB: ledgerguard }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ledgerguard -d ledgerguard"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements.txt }
      - run: pip install -r requirements.txt
        working-directory: backend
      - run: ruff check app tests scripts
        working-directory: backend
      - run: pytest --cov=app --cov-report=term-missing
        working-directory: backend
        env: { DATABASE_URL: postgresql+psycopg://ledgerguard:ledgerguard@localhost:5432/ledgerguard, JWT_SECRET: ci-test-secret }
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package.json }
      - run: npm install
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
